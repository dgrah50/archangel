# Archangel host configuration (no secrets here — secrets live in .env)
# Language/repo-specific verification (.pre-commit-config.yaml + .agents/archangel.json) lives in each repo's default branch.
ownerUserId: 123456
dataDir: .archangel
pollIntervalMs: 30000
maxDailyUsd: 20
dailyTimezone: America/New_York

# Per-thread limits (defaults shown; any project may override the first four)
maxAutonomousStepsWithoutOwner: 25  # Attempt starts + auto-merges before the owner must be heard from
maxImplementAttemptsPerThread: 3    # implement Attempts before escalating to needs-you
maxRevisionsPerThread: 1            # review-driven revision Attempts per thread
maxRebasesPerThread: 1              # conflict-resolution rebase Attempts per thread

# Where Scouts run. Default is this machine. Uncomment to run Scouts in Sail Sailboxes (needs `sail auth login`; nothing
# from this machine's environment goes into a box). A provider runs on Sail only when it has a remote credential below; otherwise it runs here.
# compute:
#   provider: sail
#   sail:
#     app: archangel
#     maxLifetimeSeconds: 600       # server-side kill for a leaked box
#     maxDailyComputeUsd: 2         # new boxes are refused past this estimate (box-minutes at Sail's rates)
#     claudeTokenSecret: CLAUDE_CODE_OAUTH_TOKEN   # the Sail secret (`sail secret set <name>`) the egress policy injects; the box sees only a placeholder
#     remoteClaudeAttempts: false   # let claude entries run on Sail (off: they stay local)
#     codexApiKeySecret: OPENAI_API_KEY_SAIL   # codex entries run on Sail with this OpenAI API key (`sail secret set <name>`); unset: codex stays local
#     codexBrokerHome: ~/.archangel/accounts/codex-sail   # instead of codexApiKeySecret: a dedicated ChatGPT login the daemon's token broker keeps fresh (see README, Running providers on Sail)
#     geminiApiKeySecret: GEMINI_API_KEY_SAIL  # agy entries run on Sail with this Gemini API key; unset: agy stays local

# Execution timeouts (ms unless noted)
implementMaxTurns: 40               # agent turn cap for one implement Attempt
implementTimeoutMs: 1200000         # wall-clock cap for one implement Attempt
setupTimeoutMs: 300000              # .agents/setup dependency install
staleLeaseMs: 180000                # daemon lock considered dead after this
gateStartGraceMs: 300000            # wait for the Gate check to start
gateTimeoutMs: 3600000              # wait for the Gate check to finish
reviewerOutageMaxMs: 21600000       # how long to wait for reviewers before escalating

# Native CLI subscriptions with fallback chains (no API keys required),
# or switch to `authMode: api` for metered API keys in .env.
authMode: subscription
# Subscription accounts (optional). Without this list there is one implicit account per provider on the CLI's default home.
# Log each account in by hand with its own home, then list it here; Archangel never reads or copies a token:
#   claude: CLAUDE_CONFIG_DIR=<home> claude        codex: CODEX_HOME=<home> codex login        agy: HOME=<home> agy
# (agy has no per-login setting, so its home is passed as HOME; check `archangel doctor --smoke` shows the right account.)
# A chain entry may pin `accounts: [ids]`; by default it uses every account of its provider.
# accounts:
#   - { id: claude-a, provider: claude, home: ~/.archangel/accounts/claude-a }
#   - { id: claude-b, provider: claude, home: ~/.archangel/accounts/claude-b, maxAttemptsPerDay: 12 }
#   - { id: codex-a,  provider: codex,  home: ~/.archangel/accounts/codex-a }
#   - { id: codex-b,  provider: codex,  home: ~/.archangel/accounts/codex-b }
#   - { id: agy-a,    provider: agy,    home: ~/.archangel/accounts/agy-a }
#   - { id: agy-b,    provider: agy,    home: ~/.archangel/accounts/agy-b }

# One chain per role, so menial work can run on cheaper models than the first implementation.
# Each entry is { provider, model? }; the first entry that is not cooling down runs, the rest are failover.
# Vendor independence applies across implement, revise and rebase: no reviewer shares a vendor with any of them.
chains:
  implement:
    - provider: codex
      model: gpt-5.4          # the expensive tier for the first, hardest pass
    - provider: agy
  revise:
    - provider: codex
      model: gpt-5.4-mini     # a cheaper tier for review feedback (vendor stickiness still applies)
    - provider: agy
  rebase:
    - provider: codex
      model: gpt-5.4-mini     # LLM rebase only; the deterministic Broker rebase costs 0 tokens
    - provider: agy
  scout:                      # read-only Scouts: needs a claude or codex entry
    - provider: claude
    - provider: codex
  triage:                     # reserved for escalation triage; validated, not used yet
    - provider: claude
reviewerChain:
  - provider: agy
  - provider: claude
  - provider: codex

# Bundled fleet Scouts for anti-slop hygiene: run on every project below (once Scouts are enabled there) unless the
# repo's .agents/archangel.json opts out with "fleetScouts": { "optOut": ["anti-slop-cleanup"] }. Always promotion: owner.
# fleetScouts: [anti-slop-bugs, anti-slop-cleanup]
# fleet-pr-miner is a read-only cross-repo pitch Scout (Skills, Scouts, graduation/pruning, Archangel improvements). Provisional
# below 20 merged PRs: its pitches say so. Optional owner notes it may read (absolute paths, secret-scanned, max 5):
# fleetScouts: [fleet-pr-miner]
# fleetMinerSeeds: [/Users/me/notes/review-report.md]

# Signal layer (off by default): adapters record merged PRs, releases, Dependabot advisories and your schedules as durable
# signals; the rules below (yours, host-wide) turn them into actions, each at most once, within the caps. Advisories are
# untrusted: a rule on them may only start a pitch (run_pitch), and any other action fails config load. Filed issues carry
# agent-proposed and never start work until you apply ready-for-agent. Run/pitch actions need scouts.enabled on the project.
# signals:
#   enabled: true
#   maxActionsPerDay: 5
#   schedules:
#     - { name: weekly-review, every: weekly }
#   rules:
#     - name: advisory-pitch
#       on: advisory
#       do: { action: run_pitch, scout: fleet-pr-miner }
#       maxPerDay: 1
#     - name: release-chore
#       on: release
#       repo: owner/my-repo
#       do: { action: file_issue, class: chore, title: Check the release for follow-ups }
#     - name: weekly-sweep
#       on: schedule
#       schedule: weekly-review
#       do: { action: run_scout, scout: self-audit }
#     # Local telemetry (never sent anywhere) is compared hourly: the last 24h against the 7 days before. A regression, error
#     # spike, repeated 429 or quota hit, slow ticks or repeated Gate timeouts becomes one mechanical telemetry_anomaly signal
#     # per metric, repo and day. Mechanical signals may file an issue or run any Scout; the Scout reads the anomaly, not you.
#     - name: telemetry-chore
#       on: telemetry_anomaly
#       do: { action: file_issue, class: chore, title: Investigate a telemetry anomaly }
#       maxPerDay: 1
#     # The regression watch groups outcomes by (workflow file, prompt) version. A version whose rework rate rose, or that has any
#     # revert, appears in the daily digest with a revert hint and also becomes one mechanical policy_regression signal.
#     - name: regression-chore
#       on: policy_regression
#       do: { action: file_issue, class: chore, title: Investigate a policy regression }
#       maxPerDay: 1
#     # or hand it to the meta-Scout for deeper analysis:
#     # - name: telemetry-deep-dive
#     #   on: telemetry_anomaly
#     #   do: { action: run_pitch, scout: fleet-pr-miner }

# External research (off while topics is empty). Once a day, and only when a signals rule listens for `research`, the host
# crosses each topic with fixed query templates (GitHub repository search, GitHub latest releases, arXiv) and stores
# sanitized title/url/date/snippet rows. No model ever writes a query. Results are untrusted: a rule on `research` may only
# run_pitch, and the pitch prompts show them as a fenced DATA block that a pitch cites by number. Topics: at most 5, each
# at most 40 characters of a-z 0-9 space . + -. maxFetchesPerDay and minIntervalMs are provisional.
# research:
#   topics: [json query cli, jsonpath performance]
#   maxFetchesPerDay: 20
#   minIntervalMs: 3000
#   # O9: up to 10 public repos (owner/name). The host keeps shallow read-only clones under dataDir/watched, refreshed weekly, and
#   # shows the fleet-pr-miner only SHAs, file paths, layout, stars and latest release tag. A pattern from them (or from research)
#   # is pitched only if a cited file in our own repo contains a cited symbol; otherwise the pitch is dropped.
#   watchRepos: [owner/name]
# signals:
#   rules:
#     - name: research-pitch
#       on: research
#       do: { action: run_pitch, scout: fleet-pr-miner }

# Prompt proposer (O7): `archangel eval propose` drafts one reviewer prompt or rubric change from dev-set failure counts, scores it on
# the held-out set and opens an agent-draft PR (owner merges) only if it beats the baseline. Bounded to 1 run per week by the command
# itself, so a weekly schedule is safe, e.g. a launchd or cron entry (Mondays 09:00):
#   0 9 * * 1  cd ~/Projects/archangel-deploy && bun src/cli/index.ts eval propose -c archangel.yaml
# Needs authMode: subscription and Archangel's own repo (dgrah50/archangel) listed under projects.

# Optional Paseo daemon endpoint for Handoff
paseoHost: 127.0.0.1:6767

projects:
  - repo: owner/my-repo
    defaultBranch: main
    workspace: local-clone
    shadowMode: true
    maxConcurrentThreads: 2
    maxAutoMergesPerDay: 3
    # Gate bounds, test commands, required checks, review rubric and Scouts live in the repo's
    # .agents/archangel.json (version 1), not here. Landing: shadowMode true forces owner merge.
    # scouts: { enabled: false, maxRunsPerDay: 2, maxOpenProposals: 3, maxAutoPromotionsPerDay: 1 }

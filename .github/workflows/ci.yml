name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - run: bun install --frozen-lockfile
      # The same command agents run locally: lint, formal models, typecheck, tests, build, and the committed Gate bundle
      # matching a fresh build (target repos run that bundle from a pinned SHA, so it must match the source).
      - run: bun run check

name: Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ARCHANGEL_REPO: dgrah50/archangel
  # Pin to an immutable 40-char commit SHA of dgrah50/archangel (updated by `npm run pilot:setup -- --install-workflow`).
  ARCHANGEL_GATE_SHA: REPLACE_WITH_PINNED_ARCHANGEL_COMMIT_SHA

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest

    steps:
      - name: Classify PR (pass-through non-factory & fork PRs without checking out untrusted code)
        id: classify
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD_REPO" = "$BASE_REPO" ] && [[ "$HEAD_REF" == factory/* ]]; then
            echo "is_factory=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-factory or fork PR ($HEAD_REPO:$HEAD_REF) — mechanical Gate pass-through."
            echo "is_factory=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR merge ref with full history
        if: steps.classify.outputs.is_factory == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        if: steps.classify.outputs.is_factory == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build pinned archangel-gate binary
        if: steps.classify.outputs.is_factory == 'true'
        run: |
          if [[ ! "$ARCHANGEL_GATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: ARCHANGEL_GATE_SHA must be a pinned 40-character commit SHA (got: $ARCHANGEL_GATE_SHA)" >&2
            exit 2
          fi
          rm -rf "$RUNNER_TEMP/archangel-src"
          git init -q "$RUNNER_TEMP/archangel-src"
          git -C "$RUNNER_TEMP/archangel-src" remote add origin "https://github.com/${ARCHANGEL_REPO}.git"
          git -C "$RUNNER_TEMP/archangel-src" fetch --depth=1 origin "$ARCHANGEL_GATE_SHA"
          git -C "$RUNNER_TEMP/archangel-src" checkout -q FETCH_HEAD
          (cd "$RUNNER_TEMP/archangel-src/gate" && go build -o "$RUNNER_TEMP/archangel-gate" ./cmd/archangel-gate)

      - name: Run Archangel Mechanical Gate
        if: steps.classify.outputs.is_factory == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"
          EXTRA_ARGS=()
          if [[ "$HEAD_REF" =~ ^factory/revert-[0-9]+$ ]]; then
            REVERT_OF=$(git log -1 --format=%B "$HEAD_SHA" | sed -nE 's/^This reverts commit ([0-9a-f]{40})\..*/\1/p' | head -n 1)
            if [ -z "$REVERT_OF" ]; then
              echo "ERROR: factory/revert-* branch missing 'This reverts commit <40-char-sha>.' trailer" >&2
              exit 1
            fi
            EXTRA_ARGS+=(--revert-of "$REVERT_OF")
          fi
          "$RUNNER_TEMP/archangel-gate" \
            --repo . \
            --base "$BASE_SHA" \
            --head HEAD \
            --policy-from-base \
            "${EXTRA_ARGS[@]}"
